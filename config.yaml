gpu:
  poll_interval_seconds: 2
launcher:
  base_port: 9001
  host: 127.0.0.1
  port: 9124
llama_server:
  backends_dir: ./backends
  binary: llama-server
  default_args: --no-webui --parallel 1 --jinja --cache-ram 16384 --kv-unified
  selected_backend: llama.cpp-win-x86_64-nvidia-cuda12-avx2-2.29.0
  # Default GPU layer offload for all models unless overridden per-model.
  # None = auto-detect (llama.cpp decides), 999 = offload all layers to GPU,
  # specific int = that many layers. Requires compatible backend.
  default_n_gpu_layers: 999
models:
  auto_save_state: false
  idle_timeout_seconds: 3600
  max_loaded_models: 1
  root_dir: n:/work/stuff/Beta
  save_state_dir: ./states
