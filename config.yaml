engines:
  strata:
    argv:
    - '{interpreter}'
    - '{serve_script}'
    - --engine
    - '{engine}'
    - --config
    - '{derived_config}'
    - --port
    - '{port}'
    - --host
    - 127.0.0.1
    config_key: exe
    config_overlay:
      cors_origins:
      - '*'
      idle_unload_s: 0
      lazy_load: false
      slot_save_path: N:/work/stuff/Beta/llama-autoloader/states
    config_overlay_dynamic:
      aliases:
      - '{model_id}'
    configs_dir: N:/work/WD/Strata
    cwd: N:/work/WD/Strata
    enabled: true
    env_scrub:
    - STRATA_API_KEY
    - STRATA_ALLOWED_HOSTS
    interpreter: N:/work/WD/Strata/.venv/Scripts/python.exe
    label: Strata
    min_free_vram_flag: --min-free-vram-mib
    ready_timeout_seconds: 600
    serve_script: N:/work/WD/Strata/serve/server.py
gpu:
  poll_interval_seconds: 5
launcher:
  base_port: 9001
  host: 127.0.0.1
  port: 9124
llama_server:
  backends_dir: ./backends
  binary: llama-server
  default_args: --no-webui --parallel 1 --jinja --kv-unified --cache-ram 32768
  default_n_gpu_layers: 999
  selected_backend: llama.cpp-win-x86_64-nvidia-cuda13-avx2-0.6.0-custom-d6572889c
logging:
  backup_count: 5
  enabled: true
  filename: console.log
  level: INFO
  log_dir: ./logs
  max_bytes: 10485760
models:
  auto_save_state: false
  idle_timeout_seconds: 3600
  max_loaded_models: 1
  root_dir: n:/work/stuff/Beta
  save_state_dir: N:/work/stuff/Beta/llama-autoloader/states
  save_state_max_keep: 3
