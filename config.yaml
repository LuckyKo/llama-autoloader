gpu:
  poll_interval_seconds: 5
launcher:
  base_port: 9001
  host: 127.0.0.1
  port: 9124
llama_server:
  backends_dir: ./backends
  binary: llama-server
  default_args: --no-webui --parallel 1 --jinja --kv-unified --cache-ram 32768
  default_n_gpu_layers: 999
  selected_backend: llama.cpp-win-x86_64-nvidia-cuda12-avx2-0.5.0-custom
logging:
  backup_count: 5
  enabled: true
  filename: console.log
  level: INFO
  log_dir: ./logs
  max_bytes: 10485760
models:
  auto_save_state: false
  idle_timeout_seconds: 3600
  max_loaded_models: 1
  root_dir: n:/work/stuff/Beta
  save_state_dir: ./states
