[pytest]
# asyncio_mode = auto lets new async tests omit @pytest.mark.asyncio.
# Existing marked tests (test_server.py) still pass unchanged in auto mode.
asyncio_mode = auto

# Root-cause fix for Windows flakiness: pytest-asyncio 1.x creates a fresh
# ProactorEventLoop per test by default (~69 async tests + TestClient portal loops).
# On Windows each ProactorEventLoop needs a socketpair; churning dozens exhausts
# Winsock buffers -> intermittent OSError [WinError 10055] and dangling-loop
# AttributeError on GC. Scope the loop to the SESSION so ONE loop serves all async
# tests (no per-test churn). This is the documented pytest-asyncio 1.x mechanism
# (the older `event_loop` fixture override is deprecated in favor of this config).
asyncio_default_fixture_loop_scope = session

# Exclude non-test directories from recursion. (The ad-hoc live-HTTP scripts named
# test_*.py at the repo root are excluded via collect_ignore in the root conftest.py,
# since norecursedirs only applies to directories.)
norecursedirs = *.egg backends states static __pycache__ .git
